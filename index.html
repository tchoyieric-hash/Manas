<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANAS — Global OS Artisans & BTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#f97316', 600: '#ea580c' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #f97316 0%, #ec4899 50%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] flex flex-col justify-between pb-20">

    <header class="sticky top-0 z-40 glass border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-lg font-extrabold tracking-tight gradient-text">MANAS</span>
            <span class="text-[9px] uppercase px-1.5 py-0.5 rounded-full bg-brand-500/20 text-brand-400 font-semibold">OS</span>
        </div>
        <button onclick="openAuthModal()" id="auth-btn" class="bg-gradient-to-r from-brand-600 to-brand-500 px-3.5 py-2 rounded-xl text-xs font-bold text-white shadow-lg">Connexion</button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-4">
        <section class="space-y-4">
            <div class="glass-card p-5 rounded-2xl border border-slate-800 space-y-2">
                <h1 class="text-xl font-black">Trouvez un artisan certifié</h1>
                <p class="text-xs text-slate-400">Plateforme globale BTP & Séquestre.</p>
            </div>
            <div id="artisans-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="glass-card p-4 rounded-xl border border-slate-800 space-y-2">
                    <h4 class="font-bold text-sm text-white">Atelier Nlong (Demo)</h4>
                    <span class="text-[10px] text-brand-400 font-semibold">Menuiserie & Agencement • Yaoundé</span>
                    <p class="text-xs text-slate-300">Expert en mobilier sur mesure et finitions haut standing.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL AUTH -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="glass-card p-6 rounded-2xl border border-slate-800 max-w-xs w-full space-y-4 relative">
            <button onclick="closeAuthModal()" class="absolute top-3 right-3 text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            <h3 class="text-lg font-bold text-center gradient-text">Connexion MANAS</h3>
            <input type="email" id="email" placeholder="Votre email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
            <input type="password" id="password" placeholder="Mot de passe" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white">
            <button onclick="handleLogin()" class="w-full bg-brand-500 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg">Se connecter</button>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function handleLogin() {
            alert("Mode démonstration actif — Authentification initialisée avec succès !");
            document.getElementById('auth-btn').innerText = "Mon Compte";
            closeAuthModal();
        }
    </script>
</body>
</html>
